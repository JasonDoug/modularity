[project]
name = "modularity-registry-tui"
version = "0.1.0"
description = "Real-time TUI dashboard for Modularity Registry"
authors = [
    { name = "Modularity Contributors" }
]
requires-python = ">=3.9"
dependencies = [
    "textual>=0.47.0",
    "requests>=2.31.0",
    "sseclient-py>=1.8.0",
]

[project.scripts]
modularity-tui = "registry_tui.tui:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "textual-dev>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false  # This is an application, not a library
